<!doctype html>
<html><head><meta charset="utf-8"><style>
  @font-face { font-family: GeorgiaLocal; src: local(Georgia); }
  *{box-sizing:border-box} body{margin:0;width:1200px;height:630px;background:#f5efe5;color:#201813;font-family:Arial,Helvetica,sans-serif;overflow:hidden;}
  .card{position:relative;width:1200px;height:630px;padding:54px;background:radial-gradient(circle at 18% 8%, rgba(164,99,75,.16), transparent 430px),linear-gradient(180deg,#f5efe5,#fbf6ee);}
  .card:after{content:"";position:absolute;inset:0;opacity:.22;background-image:radial-gradient(rgba(45,33,26,.14) .8px, transparent .8px);background-size:5px 5px;mix-blend-mode:multiply;pointer-events:none;}
  .border{position:absolute;inset:54px;border:1px solid rgba(45,33,26,.18);border-radius:34px;}
  .inner{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:8px;}
  .mark{width:96px;height:96px;border:3px solid #201813;border-radius:50%;display:grid;place-items:center;font-family:Georgia,'Times New Roman',serif;font-size:58px;line-height:1;margin-bottom:28px;}
  .name{font-family:Georgia,'Times New Roman',serif;font-size:132px;line-height:.88;letter-spacing:-7px;margin-bottom:34px;}
  .kicker{font-size:23px;font-weight:800;letter-spacing:5px;color:#5c6144;margin-bottom:30px;}
  .rule{width:330px;height:2px;background:#a4634b;margin-bottom:28px;opacity:.78;}
  .sub{font-size:26px;color:#6f6258;font-weight:500;}
</style></head><body>
  <main class="card">
    <div class="border"></div>
    <section class="inner">
      <div class="mark">C</div>
      <div class="name">Canopy</div>
      <div class="kicker">PRACTICAL AI FOR REAL WORK</div>
      <div class="rule"></div>
      <div class="sub">guides · job-search support · systems audits</div>
    </section>
  </main>
</body></html>
