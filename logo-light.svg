<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="500" height="550">
  <rect width="500" height="550" fill="#F5F0EB"/>

  <!-- Arch/Canopy Frame - double line -->
  <g transform="translate(250, 200)">
    <!-- Outer arch -->
    <path d="M-90 80 L-90 -20 Q-90 -110 0 -110 Q90 -110 90 -20 L90 80"
          fill="none" stroke="#1B3A2D" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Inner arch -->
    <path d="M-70 80 L-70 -10 Q-70 -90 0 -90 Q70 -90 70 -10 L70 80"
          fill="none" stroke="#1B3A2D" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Vertical divider lines inside arch (greenhouse effect) -->
    <line x1="0" y1="-108" x2="0" y2="-90" stroke="#1B3A2D" stroke-width="3"/>
    <line x1="-50" y1="-95" x2="-40" y2="-80" stroke="#1B3A2D" stroke-width="2.5"/>
    <line x1="50" y1="-95" x2="40" y2="-80" stroke="#1B3A2D" stroke-width="2.5"/>

    <!-- Horizontal bar connecting arches at top -->
    <path d="M-55 -85 Q0 -65 55 -85" fill="none" stroke="#1B3A2D" stroke-width="2.5"/>

    <!-- Lemon body -->
    <g transform="translate(0, 5) rotate(-30)">
      <ellipse cx="0" cy="0" rx="38" ry="28" fill="#F5A623"/>
      <!-- Lemon tips -->
      <path d="M-38 0 Q-48 -3 -44 2 Q-48 5 -38 2" fill="#F5A623"/>
      <path d="M38 0 Q48 -3 44 -1 Q48 3 38 1" fill="#F5A623"/>
      <!-- Lemon outline -->
      <ellipse cx="0" cy="0" rx="38" ry="28" fill="none" stroke="#1B3A2D" stroke-width="2.5"/>
      <!-- Lemon point left -->
      <path d="M-36 -4 Q-46 0 -36 4" fill="none" stroke="#1B3A2D" stroke-width="2.5"/>
      <!-- Lemon point right -->
      <path d="M36 -4 Q46 0 36 4" fill="none" stroke="#1B3A2D" stroke-width="2.5"/>
    </g>

    <!-- Stem -->
    <path d="M18 -25 Q22 -50 15 -60" fill="none" stroke="#1B3A2D" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Leaf 1 -->
    <path d="M15 -58 Q35 -72 28 -48 Q22 -55 15 -58 Z" fill="none" stroke="#1B3A2D" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Leaf vein -->
    <path d="M17 -56 Q26 -62 26 -52" fill="none" stroke="#1B3A2D" stroke-width="1.5"/>

    <!-- Leaf 2 -->
    <path d="M17 -52 Q0 -68 10 -44 Q12 -50 17 -52 Z" fill="none" stroke="#1B3A2D" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Leaf 2 vein -->
    <path d="M15 -50 Q8 -58 11 -46" fill="none" stroke="#1B3A2D" stroke-width="1.5"/>
  </g>

  <!-- CANOPY text -->
  <text x="250" y="360" text-anchor="middle" font-family="'Georgia', 'Times New Roman', 'Playfair Display', serif" font-weight="700" font-size="58" fill="#1B3A2D" letter-spacing="6">CANOPY</text>

  <!-- ACADEMY subtitle -->
  <text x="250" y="400" text-anchor="middle" font-family="'Georgia', 'Times New Roman', 'Playfair Display', serif" font-weight="400" font-size="24" fill="#1B3A2D" letter-spacing="12">ACADEMY</text>
</svg>