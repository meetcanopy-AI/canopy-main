<!doctype html>
<html><head><meta charset="utf-8"><style>
  *{box-sizing:border-box} body{margin:0;width:1200px;height:630px;background:#f5efe5;color:#201813;font-family:Arial,Helvetica,sans-serif;overflow:hidden;}
  .card{position:relative;width:1200px;height:630px;padding:54px;background:radial-gradient(circle at 16% 10%, rgba(164,99,75,.16), transparent 430px),radial-gradient(circle at 85% 82%, rgba(92,97,68,.14), transparent 380px),linear-gradient(180deg,#f7f0e6,#fbf7ef);}
  .card:after{content:"";position:absolute;inset:0;opacity:.20;background-image:radial-gradient(rgba(45,33,26,.14) .8px, transparent .8px);background-size:5px 5px;mix-blend-mode:multiply;pointer-events:none;}
  .border{position:absolute;inset:48px;border:1px solid rgba(45,33,26,.18);border-radius:34px;}
  .inner{position:relative;z-index:2;height:100%;display:grid;grid-template-columns:.82fr 1.18fr;gap:50px;align-items:center;padding:18px 36px;}
  .brand{align-self:stretch;border-right:1px solid rgba(45,33,26,.16);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding-left:14px;}
  .mark{width:96px;height:96px;border:3px solid #201813;border-radius:50%;display:grid;place-items:center;font-family:Georgia,'Times New Roman',serif;font-size:58px;line-height:1;margin-bottom:30px;background:rgba(255,250,241,.42);}
  .name{font-family:Georgia,'Times New Roman',serif;font-size:96px;line-height:.88;letter-spacing:-5px;margin-bottom:22px;}
  .studio{font-size:19px;font-weight:800;letter-spacing:3.4px;color:#5c6144;text-transform:uppercase;max-width:360px;line-height:1.35;}
  .copy{padding-right:18px;}
  .eyebrow{font-size:21px;font-weight:900;letter-spacing:4px;color:#a4634b;text-transform:uppercase;margin-bottom:26px;}
  h1{font-family:Georgia,'Times New Roman',serif;font-size:76px;line-height:.94;letter-spacing:-3.7px;margin:0 0 26px;max-width:650px;font-weight:500;}
  .sub{font-size:28px;line-height:1.23;color:#62564d;font-weight:500;max-width:660px;}
  .pill{display:inline-flex;margin-top:34px;border:1px solid rgba(45,33,26,.18);border-radius:999px;padding:13px 18px;background:rgba(255,250,241,.54);font-size:18px;font-weight:800;color:#3f332b;letter-spacing:.4px;}
</style></head><body>
  <main class="card">
    <div class="border"></div>
    <section class="inner">
      <div class="brand">
        <div class="mark">C</div>
        <div class="name">Canopy</div>
        <div class="studio">woman-owned AI work studio</div>
      </div>
      <div class="copy">
        <div class="eyebrow">systems · courses · job search</div>
        <h1>Practical AI help for real work.</h1>
        <div class="sub">AI systems audits, career kits, and course guides for women building cleaner work and money paths.</div>
        <div class="pill">meetcanopy.club</div>
      </div>
    </section>
  </main>
</body></html>
